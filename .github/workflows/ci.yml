name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: CLI smoke test
        run: python -m dataguard --help
      - name: Generate fixtures and run monitor
        run: |
          python -m dataguard.sample_data_generator
          python -m dataguard --config config/rules.json --output-dir output --db output/dq_history.sqlite --no-fail
      - name: Tests
        run: python -m pytest -q
